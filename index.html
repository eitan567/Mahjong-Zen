
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mahjong Zen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* STRICTLY NO SCROLLING */
        touch-action: none; /* Disable browser gestures */
        font-family: 'Noto Sans Hebrew', sans-serif;
        background-color: #0f172a; /* Dark fallback */
        color: #e7e5e4;
      }
      .font-serif {
        font-family: 'Noto Serif', serif;
      }
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* 3D Tile Effects */
      .mahjong-tile {
        transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.15s;
        box-shadow: 
          1px 1px 0px #a8a29e,
          2px 2px 0px #78716c,
          3px 3px 1px rgba(0,0,0,0.2),
          4px 4px 4px rgba(0,0,0,0.3);
      }

      /* Selected Glow */
      .mahjong-shadow-selected {
        box-shadow: 
          0 0 0 2px #f59e0b,
          0 0 15px rgba(251, 191, 36, 0.6),
          1px 1px 0px #a8a29e,
          2px 2px 0px #78716c;
      }

      /* Float Idle Animation */
      @keyframes float-idle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      .animate-float-idle {
        animation: float-idle 5s ease-in-out infinite;
      }
      .animate-float-idle:hover {
        animation: none;
      }

      /* Selected Animation - Distinct Bounce */
      @keyframes selected-bounce {
        0%, 100% { transform: translateY(-16px) scale(1.05); }
        50% { transform: translateY(-24px) scale(1.05); }
      }
      .animate-selected {
        animation: selected-bounce 1.5s ease-in-out infinite;
      }
    </style>
